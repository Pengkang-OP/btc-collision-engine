version: '3.8'

# BTC碰撞引擎 - Docker Compose配置
# 支持CPU和GPU两种模式

services:
  # CPU模式
  btc-engine-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUN_MODE: "cpu"
    image: btc-collision-engine:latest
    container_name: btc-collision-cpu
    restart: unless-stopped
    
    # 环境变量
    environment:
      - PYTHONUNBUFFERED=1
      - RUN_MODE=cpu
      - COLLISION_MODE=random
      - CHECKPOINT_ENABLED=true
      - DEDUP_ENABLED=true
    
    # 配置文件
    volumes:
      - ./config.production.json:/opt/btc-collision-engine/config.production.json:ro
      - ./targets.txt:/opt/btc-collision-engine/targets.txt:ro
      - btc-data:/opt/btc-collision-engine/data_logs
      - btc-logs:/opt/btc-collision-engine/logs
      - btc-monitor:/opt/btc-collision-engine/monitoring_data
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 4G
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-m", "src.utils.health_check", "--quiet"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    
    # 覆盖默认命令
    command: >
      python key_collision_cli.py
      --config /opt/btc-collision-engine/config.production.json
      --mode random
      --checkpoint
      --dedup
      --workers 8
    
    profiles:
      - cpu
  
  # GPU模式（NVIDIA）
  btc-engine-gpu-nvidia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUN_MODE: "gpu"
    image: btc-collision-engine:gpu
    container_name: btc-collision-gpu
    restart: unless-stopped
    
    # GPU支持
    runtime: nvidia
    environment:
      - PYTHONUNBUFFERED=1
      - RUN_MODE=gpu
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - COLLISION_MODE=random
      - CHECKPOINT_ENABLED=true
      - DEDUP_ENABLED=true
    
    # 配置文件
    volumes:
      - ./config.production.json:/opt/btc-collision-engine/config.production.json:ro
      - ./targets.txt:/opt/btc-collision-engine/targets.txt:ro
      - btc-data:/opt/btc-collision-engine/data_logs
      - btc-logs:/opt/btc-collision-engine/logs
      - btc-monitor:/opt/btc-collision-engine/monitoring_data
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-m", "src.utils.health_check", "--quiet", "--gpu"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    
    # 覆盖默认命令
    command: >
      python key_collision_cli.py
      --config /opt/btc-collision-engine/config.production.json
      --mode random
      --checkpoint
      --dedup
      --gpu
      --gpu-batch-size 65536
    
    profiles:
      - gpu
      - nvidia
  
  # GPU模式（AMD）
  btc-engine-gpu-amd:
    build:
      context: .
      dockerfile: Dockerfile.amd
      args:
        RUN_MODE: "gpu"
    image: btc-collision-engine:gpu-amd
    container_name: btc-collision-gpu-amd
    restart: unless-stopped
    
    # GPU支持（AMD需要设备映射）
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    
    environment:
      - PYTHONUNBUFFERED=1
      - RUN_MODE=gpu
      - COLLISION_MODE=random
      - CHECKPOINT_ENABLED=true
      - DEDUP_ENABLED=true
    
    # 配置文件
    volumes:
      - ./config.production.json:/opt/btc-collision-engine/config.production.json:ro
      - ./targets.txt:/opt/btc-collision-engine/targets.txt:ro
      - btc-data:/opt/btc-collision-engine/data_logs
      - btc-logs:/opt/btc-collision-engine/logs
      - btc-monitor:/opt/btc-collision-engine/monitoring_data
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-m", "src.utils.health_check", "--quiet", "--gpu"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    
    # 覆盖默认命令
    command: >
      python key_collision_cli.py
      --config /opt/btc-collision-engine/config.production.json
      --mode random
      --checkpoint
      --dedup
      --gpu
      --gpu-batch-size 65536
    
    profiles:
      - gpu
      - amd
  
  # 监控服务（可选）
  monitoring:
    image: grafana/grafana:latest
    container_name: btc-monitoring
    restart: unless-stopped
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    profiles:
      - monitoring
  
  # Prometheus（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: btc-prometheus
    restart: unless-stopped
    
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    
    ports:
      - "9090:9090"
    
    profiles:
      - monitoring

# 数据卷
volumes:
  btc-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  
  btc-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs
  
  btc-monitor:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./monitoring
  
  grafana-data:
    driver: local
  
  prometheus-data:
    driver: local

# 网络
networks:
  default:
    name: btc-collision-network
    driver: bridge
