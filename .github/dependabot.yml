# Dependabot 自动依赖更新配置
# 文档: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Python 依赖
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    ignore:
      - dependency-name: "gmpy2"
        update-types: ["version-update:semver-major"]
      # numpy/pyopencl: 上限已从 1.x/2025.x 放宽至 2.x/2026.x，
      # patch 和 minor 更新安全，不再忽略。
      # 若后续收紧上限需重新添加对应 ignore 规则。
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions 自身依赖
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "automated"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker 依赖
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "automated"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
