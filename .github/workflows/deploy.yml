name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build documentation
        run: |
          echo "📚 准备文档部署..."
          mkdir -p _site
          python3 - <<'PYEOF'
          import os

          # 读取项目版本
          version = "5.0.1"
          try:
              with open("pyproject.toml", "r", encoding="utf-8") as f:
                  for line in f:
                      if line.startswith("version ="):
                          version = line.split('"')[1]
                          break
          except Exception:
              pass

          index_html = f"""<!DOCTYPE html>
          <html lang="zh-CN">
          <head><meta charset="UTF-8"><title>BTC Collision Engine Docs</title>
          <style>body{{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:2em;background:#0d1117;color:#c9d1d9}}a{{color:#58a6ff}}code{{background:#161b22;padding:2px 6px;border-radius:3px}}</style></head>
          <body>
          <h1>BTC Collision Engine</h1>
          <p>比特币私钥碰撞引擎 v{version} - 文档</p>
          <h2>文档索引</h2><ul>"""
          for root, dirs, files in os.walk("docs"):
              dirs.sort()
              for f in sorted(files):
                  if f.endswith(".md"):
                      rel = os.path.join(root, f).replace("\\", "/")
                      name = f.replace(".md", "").replace("_", " ").title()
                      index_html += f'<li><a href="{rel}">{name}</a></li>'
          index_html += f"""</ul><footer style='margin-top:3em;color:#484f58'><small>BTC Collision Engine v{version}</small></footer></body></html>"""
          with open("_site/index.html", "w", encoding="utf-8") as f:
              f.write(index_html)
          print("✅ 生成 _site/index.html")
          PYEOF
          cp -r docs/* _site/
          echo "✅ 文档构建完成"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
