name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 运行完整测试套件，确保发布质量
  # ─────────────────────────────────────────────
  test:
    name: 发布前测试验证
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: 运行测试套件
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            -m "not (gpu or gpu_kernel or multi_gpu)" \
            --timeout=600

  # ─────────────────────────────────────────────
  # Job 2: 构建发布包
  # ─────────────────────────────────────────────
  build:
    name: 构建发布包
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装构建工具
        run: pip install --upgrade pip build twine

      - name: 构建 sdist 和 wheel
        run: python -m build

      - name: 检查包
        run: twine check dist/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/

  # ─────────────────────────────────────────────
  # Job 3: 发布到 PyPI（可选）
  # ─────────────────────────────────────────────
  publish-pypi:
    name: 发布到 PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true  # 避免重复发布

  # ─────────────────────────────────────────────
  # Job 4: 创建 GitHub Release
  # ─────────────────────────────────────────────
  github-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: build
    environment: release

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取版本号
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 从 CHANGELOG 提取发布说明
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          NOTES=$(python3 - <<PYEOF
          import re, sys, os, subprocess

          version = os.environ.get("VERSION", "")
          tag = os.environ.get("TAG", "")

          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
          except FileNotFoundError:
              print("CHANGELOG.md 未找到，使用 git log 生成。")
              sys.exit(0)

          patterns = [
              rf"##\s+\[{re.escape(version)}\][^\n]*\n(.*?)(?=\n##\s|\Z)",
              rf"##\s+\[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n##\s|\Z)",
              rf"##\s+{re.escape(version)}[^\n]*\n(.*?)(?=\n##\s|\Z)",
              rf"##\s+{re.escape(tag)}[^\n]*\n(.*?)(?=\n##\s|\Z)",
          ]

          for pat in patterns:
              m = re.search(pat, content, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
                  if notes:
                      print(notes)
                      sys.exit(0)

          # Fallback: git log
          try:
              tags_result = subprocess.run(
                  ["git", "tag", "--sort=-creatordate", "--merged", "HEAD"],
                  capture_output=True, text=True
              )
              tags = [t.strip() for t in tags_result.stdout.strip().split("\n") if t.strip()]
              version_tags = [t for t in tags if t.startswith("v") and t != tag]
              if version_tags:
                  prev_tag = version_tags[0]
                  log_result = subprocess.run(
                      ["git", "log", "--oneline", "--no-merges", f"{prev_tag}..HEAD"],
                      capture_output=True, text=True
                  )
                  print(log_result.stdout.strip() or f"Release {tag}")
              else:
                  result2 = subprocess.run(
                      ["git", "log", "--oneline", "--no-merges", "-20"],
                      capture_output=True, text=True
                  )
                  print(result2.stdout.strip() or f"Release {tag}")
          except Exception:
              print(f"Release {tag}")
          PYEOF
          )

          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.tag }}"
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: false
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz

  # ─────────────────────────────────────────────
  # Job 5: 构建并推送多架构 Docker 镜像
  # ─────────────────────────────────────────────
  docker-push:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建 AMD GPU 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.amd
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-amd
            ghcr.io/${{ github.repository }}:latest-amd
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
