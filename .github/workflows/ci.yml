name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # 1. 静态分析 (ruff + mypy + import-check + GPU kernel)
  # ──────────────────────────────────────────
  static-analysis:
    name: 静态分析
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装工具
        run: |
          pip install ruff>=0.9.0 mypy>=1.0.0
          pip install -r requirements-base.txt

      - name: ruff format 检查
        run: ruff format --check src/ tests/ scripts/ benchmarks/ tools/

      - name: ruff check 检查
        run: ruff check src/ tests/ scripts/ benchmarks/ tools/

      - name: mypy 类型检查
        run: mypy src/ --config-file pyproject.toml

      - name: 导入路径检查
        run: python scripts/check_import_paths.py

      - name: GPU Python 模块语法检查
        run: |
          python3 - <<'PYEOF'
          import ast, sys, glob
          errors = []
          for py_file in sorted(glob.glob("src/gpu/**/*.py", recursive=True)):
              if "__pycache__" in py_file:
                  continue
              try:
                  with open(py_file, "rb") as f:
                      raw = f.read()
                  try:
                      text = raw.decode("utf-8")
                  except UnicodeDecodeError:
                      errors.append(f"  ❌ {py_file}: 非 UTF-8 编码")
                      continue
                  try:
                      ast.parse(text, filename=py_file)
                  except SyntaxError as e:
                      errors.append(f"  ❌ {py_file}:{e.lineno}: {e.msg}")
              except Exception as e:
                  errors.append(f"  ❌ {py_file}: {e}")
          if errors:
              print(f"❌ 发现 {len(errors)} 个错误:")
              for e in errors:
                  print(e)
              sys.exit(1)
          print("✅ 所有 src/gpu/ Python 文件语法正确")
          PYEOF

      - name: OpenCL 内核结构验证
        run: |
          python3 - <<'PYEOF'
          import re, sys
          with open("src/gpu/kernel.py", encoding="utf-8") as f:
              content = f.read()
          kernel_funcs = re.findall(r'__kernel\s+void\s+(\w+)\s*\(', content)
          print(f"📋 发现 {len(kernel_funcs)} 个 __kernel 函数: {', '.join(kernel_funcs)}")
          triple_quoted = re.findall(r'"""(.*?)"""', content, re.DOTALL)
          kernel_blocks = 0
          for block in triple_quoted:
              if '__kernel' in block:
                  kernel_blocks += 1
                  open_b = block.count('{')
                  close_b = block.count('}')
                  if open_b != close_b:
                      print(f"⚠️  内核块 {kernel_blocks}: 花括号不平衡 ({{ {open_b}, }} {close_b})")
          if kernel_blocks == 0:
              print("❌ 未找到任何 OpenCL 内核代码块！")
              sys.exit(1)
          print(f"✅ 找到 {kernel_blocks} 个 OpenCL 内核代码块，结构完整")
          PYEOF

  # ──────────────────────────────────────────
  # 2. 安全扫描 (Bandit + pip-audit)
  # ──────────────────────────────────────────
  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装工具
        run: |
          pip install bandit>=1.7.0 pip-audit>=2.7.0
          pip install -r requirements-base.txt

      - name: Bandit 安全扫描
        id: bandit-scan
        run: |
          bandit -r src/ key_collision.py key_collision_cli.py \
            -ll -f json -o bandit-report.json || true
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ -s bandit-report.json ]; then
            ISSUE_COUNT=$(jq '.results | length' bandit-report.json)
            if [ "$ISSUE_COUNT" -gt 0 ]; then
              echo "⚠️  发现 ${ISSUE_COUNT} 个安全问题:"
              jq -r '.results[]? | "  [\(.test_id)] \(.filename):\(.line_number) - \(.issue_text[:120])"' bandit-report.json
            else
              echo "✅ 未发现安全问题"
            fi
          fi
          if [ $EXIT_CODE -gt 1 ]; then
            echo "❌ Bandit 执行异常 (exit=$EXIT_CODE)"
            exit $EXIT_CODE
          fi

      - name: 验证无安全问题
        if: always()
        run: |
          if [ "${{ steps.bandit-scan.outputs.exit_code }}" = "1" ]; then
            echo "⚠️  Bandit 发现安全问题（仅告警，不阻断 CI）"
          elif [ "${{ steps.bandit-scan.outputs.exit_code }}" = "0" ]; then
            echo "✅ Bandit 未发现安全问题"
          fi

      - name: pip-audit 依赖漏洞扫描
        continue-on-error: true
        run: pip-audit --requirement requirements-base.txt --desc on

      - name: 上传 Bandit 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  # ──────────────────────────────────────────
  # 3. 核心测试 (pytest + coverage + config validation)
  # ──────────────────────────────────────────
  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [static-analysis]

    steps:
      - uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgmp-dev libsecp256k1-dev

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: 配置验证
        run: python tools/validate_config.py

      - name: 运行测试
        timeout-minutes: 45
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=30 \
            -m "not (gpu or gpu_kernel or multi_gpu or integration)" \
            --ignore=tests/test_wizard.py \
            --ignore=tests/test_concurrency_stress.py \
            --ignore=tests/test_memory_locking.py \
            --ignore=tests/test_commands.py \
            --timeout=600 \
            --timeout-method=thread \
            -p no:cacheprovider > test-output.log 2>&1; RC=$?
          cat test-output.log
          exit $RC

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output.log

      - name: 上传覆盖率报告
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-py3.12

  # ──────────────────────────────────────────
  # 4. 扩展测试 (综合 + 关键路径)
  # ──────────────────────────────────────────
  extended-tests:
    name: 扩展测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [static-analysis]

    steps:
      - uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt

      - name: 五大维度综合测试
        run: pytest tests/test_comprehensive_5d.py -v --tb=short --timeout=120 --timeout-method=thread

      - name: 核心引擎测试
        run: pytest tests/unit/engine/test_base_engine.py -v --tb=short --timeout=120 --timeout-method=thread

      - name: 配置与CLI测试
        run: pytest tests/unit/config/test_config.py tests/unit/cli/test_cli.py -v --tb=short --timeout=60 --timeout-method=thread

      - name: GPU核心测试（无GPU）
        run: pytest tests/gpu/test_gpu_core.py -v --tb=short --timeout=60 --timeout-method=thread

      - name: 导入路径测试
        run: pytest tests/test_import_paths.py -v

      - name: Bech32/P2SH测试
        run: pytest tests/unit/crypto/test_bech32_p2sh_conversion.py tests/unit/crypto/test_bech32_p2sh_performance.py -v

  # ──────────────────────────────────────────
  # 5. 性能回归检测
  # ──────────────────────────────────────────
  benchmark:
    name: 性能回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [static-analysis]

    steps:
      - uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libsecp256k1-dev

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt

      - name: 运行性能基准测试
        run: |
          rm -f benchmarks/results/benchmark_[0-9]*.json
          BASELINE="benchmarks/results/benchmark-baseline.json"
          if [ -f "$BASELINE" ]; then
            echo "📊 与基线对比: $BASELINE"
            python -m benchmarks.benchmark_runner --baseline "$BASELINE" --output benchmarks/results
          else
            echo "⚠️ 未找到基线文件，仅运行基准测试"
            python -m benchmarks.benchmark_runner --output benchmarks/results
          fi

      - name: 上传基准测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/results/benchmark_*.json

      - name: 生成 PR 性能注释
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsDir = 'benchmarks/results';
            const files = fs.readdirSync(resultsDir)
              .filter(f => f.startsWith('benchmark_') && f.endsWith('.json'))
              .sort();
            if (files.length === 0) {
              console.log('未找到基准测试结果文件');
              return;
            }
            const latest = JSON.parse(fs.readFileSync(`${resultsDir}/${files[files.length-1]}`, 'utf8'));
            const comp = latest.comparison || {};
            let body = '## 📊 性能基准测试结果\n\n';
            if (comp.baseline_file) {
              body += `基线: \`${comp.baseline_file}\`\n\n`;
              const regressions = comp.regressions || [];
              const improvements = comp.improvements || [];
              if (regressions.length > 0) {
                body += '### ⚠️ 性能回归\n| 测试项 | 基线 (ops/s) | 当前 (ops/s) | 变化 |\n|---|---|---|---|\n';
                for (const r of regressions) {
                  body += `| ${r.name} | ${r.baseline_ops_per_sec.toLocaleString()} | ${r.current_ops_per_sec.toLocaleString()} | **${r.change_pct}%** |\n`;
                }
                body += '\n';
              }
              if (improvements.length > 0) {
                body += '### ✅ 性能提升\n| 测试项 | 基线 (ops/s) | 当前 (ops/s) | 变化 |\n|---|---|---|---|\n';
                for (const r of improvements) {
                  body += `| ${r.name} | ${r.baseline_ops_per_sec.toLocaleString()} | ${r.current_ops_per_sec.toLocaleString()} | +${r.change_pct}% |\n`;
                }
                body += '\n';
              }
              if (regressions.length === 0 && improvements.length === 0) {
                body += '✅ 未检测到显著性能变化（阈值 ±10%）\n\n';
              }
            } else {
              body += '本次为首次运行，未与基线对比。\n\n';
            }
            // 输出各测试项结果
            body += '### 各项测试详情\n| 测试项 | ops/s | 均值 (μs) |\n|---|---|---|\n';
            for (const [name, bm] of Object.entries(latest.benchmarks || {})) {
              if (bm.success) {
                body += `| ${name} | ${bm.ops_per_sec.toLocaleString()} | ${bm.mean_us} |\n`;
              } else {
                body += `| ${name} | ❌ 失败 | ${bm.error || ''} |\n`;
              }
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ──────────────────────────────────────────
  # 6. 文档检查
  # ──────────────────────────────────────────
  docs:
    name: 文档检查
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Markdown 规范检查
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: "**/*.md"
          config: .markdownlint.json
        continue-on-error: true

      - name: 验证文档结构
        run: |
          echo "📚 检查文档结构..."
          test -d docs && echo "✅ docs/ 目录存在" || echo "⚠️ docs/ 目录不存在"

  # ──────────────────────────────────────────
  # 7. CI 门禁检查（必须全部通过）
  # ──────────────────────────────────────────
  gate:
    name: 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [static-analysis, security, test, extended-tests, benchmark, docs]
    if: always()

    steps:
      - name: 验证所有门禁通过
        run: |
          echo "🔐 CI 门禁检查..."
          FAILED=0
          check_job() {
            local job_name="$1"
            local job_result="$2"
            if [ "$job_result" != "success" ]; then
              echo "❌ $job_name 未通过: $job_result"
              FAILED=1
            else
              echo "✅ $job_name 通过"
            fi
          }
          check_job static-analysis "${{ needs.static-analysis.result }}"
          check_job security "${{ needs.security.result }}"
          check_job test "${{ needs.test.result }}"
          check_job extended-tests "${{ needs.extended-tests.result }}"
          check_job benchmark "${{ needs.benchmark.result }}"
          check_job docs "${{ needs.docs.result }}"
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "⛔ CI 门禁未通过！请修复上述问题后重新提交。"
            exit 1
          fi
          echo "✅ 所有 CI 门禁通过！"
