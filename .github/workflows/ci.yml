name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 代码质量检查
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark pytest-cov

    - name: 检查导入路径
      run: |
        python scripts/check_import_paths.py

    - name: 运行测试
      run: |
        python -m pytest tests/ -v --tb=short --cov=src --cov-report=xml

    - name: 上传覆盖率报告
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # 导入路径专项检查
  import-check:
    name: 导入路径检查
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行导入路径检查
      run: |
        echo "🔍 检查导入路径规范..."
        python scripts/check_import_paths.py
        echo "✅ 导入路径检查通过"

  # 关键测试
  critical-tests:
    name: 关键测试
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark

    - name: 运行导入路径测试
      run: |
        echo "🧪 运行导入路径专项测试..."
        python -m pytest tests/test_import_paths.py -v
        echo "✅ 导入路径测试通过"

    - name: 运行Bech32/P2SH测试
      run: |
        echo "🧪 运行Bech32/P2SH测试..."
        python -m pytest tests/test_bech32_p2sh_conversion.py tests/test_bech32_p2sh_performance.py -v
        echo "✅ Bech32/P2SH测试通过"

  # 代码格式化检查
  lint:
    name: 代码格式化检查
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装lint工具
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: 运行Black格式化检查
      run: |
        black --check --line-length=100 src/ tests/ scripts/

    - name: 运行Flake8检查
      run: |
        flake8 src/ tests/ scripts/ --max-line-length=100 --ignore=E203,W503

  # 文档检查
  docs-check:
    name: 文档检查
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 检查Markdown文档
      uses: DavidAnson/markdownlint-cli2-action@v15
      with:
        globs: '**/*.md'
        config: .markdownlint.json
      continue-on-error: true

    - name: 验证文档链接
      run: |
        echo "📚 检查文档结构..."
        ls -la docs/
        echo "✅ 文档检查完成"
