name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # 快速门禁：代码格式 + lint（秒级完成）
  # ──────────────────────────────────────────
  lint:
    name: 代码格式化检查 (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装lint工具
        run: pip install ruff>=0.9.0

      - name: 运行 ruff format 检查
        run: ruff format --check src/ tests/ scripts/ benchmarks/ tools/

      - name: 运行 ruff check 检查
        run: ruff check src/ tests/ scripts/ benchmarks/ tools/

  # ──────────────────────────────────────────
  # 导入路径检查
  # ──────────────────────────────────────────
  import-check:
    name: 导入路径检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行导入路径检查
        run: python scripts/check_import_paths.py

  # ──────────────────────────────────────────
  # 类型检查 (mypy)
  # ──────────────────────────────────────────
  type-check:
    name: 类型检查 (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          pip install -r requirements-base.txt
          pip install mypy>=1.0.0

      - name: 运行 mypy 类型检查
        run: mypy src/ --config-file pyproject.toml

  # ──────────────────────────────────────────
  # 安全扫描 (Bandit)
  # ──────────────────────────────────────────
  security-scan:
    name: 安全扫描 (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装 bandit
        run: pip install bandit>=1.7.0

      - name: 运行 Bandit 安全扫描
        id: bandit-scan
        run: |
          bandit -r src/ key_collision.py key_collision_cli.py \
            -ll -f json -o bandit-report.json || true
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ -s bandit-report.json ]; then
            ISSUE_COUNT=$(jq '.results | length' bandit-report.json)
            if [ "$ISSUE_COUNT" -gt 0 ]; then
              echo "⚠️  发现 ${ISSUE_COUNT} 个安全问题:"
              jq -r '.results[]? | "  [\(.test_id)] \(.filename):\(.line_number) - \(.issue_text[:120])"' bandit-report.json
            else
              echo "✅ 未发现安全问题"
            fi
          fi
          # exit_code > 1 表示 bandit 异常崩溃
          if [ $EXIT_CODE -gt 1 ]; then
            echo "❌ Bandit 执行异常 (exit=$EXIT_CODE)"
            exit $EXIT_CODE
          fi

      - name: 验证无安全问题
        if: always()
        run: |
          if [ "${{ steps.bandit-scan.outputs.exit_code }}" = "1" ]; then
            echo "❌ Bandit 发现安全问题，CI 硬阻断"
            exit 1
          fi

      - name: 上传 Bandit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ──────────────────────────────────────────
  # 依赖漏洞扫描 (pip-audit)
  # ──────────────────────────────────────────
  dependency-scan:
    name: 依赖漏洞扫描 (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装 pip-audit
        run: pip install pip-audit>=2.7.0

      - name: 安装项目依赖
        run: pip install -r requirements-base.txt

      - name: 运行 pip-audit
        continue-on-error: true
        run: pip-audit --requirement requirements-base.txt --desc on

  # ──────────────────────────────────────────
  # 配置验证
  # ──────────────────────────────────────────
  config-validation:
    name: 配置验证
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements-base.txt

      - name: 验证配置一致性
        run: python tools/validate_config.py

  # ──────────────────────────────────────────
  # GPU 源码静态检查
  # ──────────────────────────────────────────
  gpu-static-check:
    name: GPU 源码静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements-base.txt

      - name: GPU Python 模块语法检查
        run: |
          python3 - <<'PYEOF'
          import ast, sys, glob
          errors = []
          for py_file in sorted(glob.glob("src/gpu/**/*.py", recursive=True)):
              if "__pycache__" in py_file:
                  continue
              try:
                  with open(py_file, "rb") as f:
                      raw = f.read()
                  try:
                      text = raw.decode("utf-8")
                  except UnicodeDecodeError:
                      errors.append(f"  ❌ {py_file}: 非 UTF-8 编码")
                      continue
                  try:
                      ast.parse(text, filename=py_file)
                  except SyntaxError as e:
                      errors.append(f"  ❌ {py_file}:{e.lineno}: {e.msg}")
              except Exception as e:
                  errors.append(f"  ❌ {py_file}: {e}")
          if errors:
              print(f"❌ 发现 {len(errors)} 个错误:")
              for e in errors:
                  print(e)
              sys.exit(1)
          print("✅ 所有 src/gpu/ Python 文件语法正确")
          PYEOF

      - name: OpenCL 内核结构验证
        run: |
          python3 - <<'PYEOF'
          import re, sys
          with open("src/gpu/kernel.py", encoding="utf-8") as f:
              content = f.read()
          kernel_funcs = re.findall(r'__kernel\s+void\s+(\w+)\s*\(', content)
          print(f"📋 发现 {len(kernel_funcs)} 个 __kernel 函数: {', '.join(kernel_funcs)}")
          triple_quoted = re.findall(r'"""(.*?)"""', content, re.DOTALL)
          kernel_blocks = 0
          for block in triple_quoted:
              if '__kernel' in block:
                  kernel_blocks += 1
                  open_b = block.count('{')
                  close_b = block.count('}')
                  if open_b != close_b:
                      print(f"⚠️  内核块 {kernel_blocks}: 花括号不平衡 ({{ {open_b}, }} {close_b})")
          if kernel_blocks == 0:
              print("❌ 未找到任何 OpenCL 内核代码块！")
              sys.exit(1)
          print(f"✅ 找到 {kernel_blocks} 个 OpenCL 内核代码块，结构完整")
          PYEOF

  # ──────────────────────────────────────────
  # 核心测试 (多版本 Python 矩阵)
  # ──────────────────────────────────────────
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]  # lint 通过后才运行完整测试

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout pytest-benchmark

      - name: 运行测试
        timeout-minutes: 25
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -m "not (gpu or gpu_kernel or multi_gpu)" \
            --timeout=600 \
            --timeout-method=signal \
            -p no:cacheprovider

      - name: 上传覆盖率报告
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}

  # ──────────────────────────────────────────
  # 五大维度综合测试
  # ──────────────────────────────────────────
  comprehensive-tests:
    name: 五大维度综合测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout hypothesis

      - name: 运行五大维度测试
        run: pytest tests/test_comprehensive_5d.py -v --tb=short --timeout=120

      - name: 运行核心引擎测试
        run: pytest tests/test_base_engine.py -v --tb=short --timeout=120

      - name: 运行配置与CLI测试
        run: pytest tests/test_config.py tests/test_cli.py -v --tb=short --timeout=60

      - name: 运行GPU核心测试（无GPU依赖）
        run: pytest tests/test_gpu_core.py -v --tb=short --timeout=60

  # ──────────────────────────────────────────
  # 关键路径测试
  # ──────────────────────────────────────────
  critical-tests:
    name: 关键路径测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-benchmark

      - name: 运行导入路径测试
        run: pytest tests/test_import_paths.py -v

      - name: 运行Bech32/P2SH测试
        run: pytest tests/test_bech32_p2sh_conversion.py tests/test_bech32_p2sh_performance.py -v

  # ──────────────────────────────────────────
  # 性能回归检测
  # ──────────────────────────────────────────
  benchmark:
    name: 性能回归检测
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 运行性能基准测试
        run: |
          rm -f benchmarks/results/benchmark_[0-9]*.json
          BASELINE="benchmarks/results/benchmark-baseline.json"
          if [ -f "$BASELINE" ]; then
            echo "📊 与基线对比: $BASELINE"
            python -m benchmarks.benchmark_runner --baseline "$BASELINE" --output benchmarks/results
          else
            echo "⚠️ 未找到基线文件，仅运行基准测试"
            python -m benchmarks.benchmark_runner --output benchmarks/results
          fi

      - name: 上传基准测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/benchmark_*.json

  # ──────────────────────────────────────────
  # 文档检查
  # ──────────────────────────────────────────
  docs-check:
    name: 文档检查
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 检查Markdown文档
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: "**/*.md"
          config: .markdownlint.json
        continue-on-error: true

      - name: 验证文档结构
        run: |
          echo "📚 检查文档结构..."
          test -d docs && echo "✅ docs/ 目录存在" || echo "⚠️ docs/ 目录不存在"

  # ──────────────────────────────────────────
  # CI 门禁检查（必须全部通过）
  # ──────────────────────────────────────────
  gate:
    name: CI 门禁检查
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, test, comprehensive-tests, critical-tests, config-validation, security-scan, dependency-scan, import-check, type-check, gpu-static-check, benchmark, docs-check]
    if: always()

    steps:
      - name: 验证所有门禁通过
        run: |
          echo "🔐 CI 门禁检查..."
          FAILED=0
          check_job() {
            local job_name="$1"
            local job_result="$2"
            if [ "$job_result" != "success" ]; then
              echo "❌ $job_name 未通过: $job_result"
              FAILED=1
            else
              echo "✅ $job_name 通过"
            fi
          }
          check_job lint "${{ needs.lint.result }}"
          check_job test "${{ needs.test.result }}"
          check_job comprehensive-tests "${{ needs.comprehensive-tests.result }}"
          check_job critical-tests "${{ needs.critical-tests.result }}"
          check_job config-validation "${{ needs.config-validation.result }}"
          check_job security-scan "${{ needs.security-scan.result }}"
          check_job dependency-scan "${{ needs.dependency-scan.result }}"
          check_job import-check "${{ needs.import-check.result }}"
          check_job type-check "${{ needs.type-check.result }}"
          check_job gpu-static-check "${{ needs.gpu-static-check.result }}"
          check_job benchmark "${{ needs.benchmark.result }}"
          check_job docs-check "${{ needs.docs-check.result }}"
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "⛔ CI 门禁未通过！请修复上述问题后重新提交。"
            exit 1
          fi
          echo "✅ 所有 CI 门禁通过！"
