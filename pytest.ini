# pytest配置文件
# 用于注册自定义标记和配置测试行为

[pytest]
# 注册自定义标记,消除PytestUnknownMarkWarning警告
markers =
    # 测试类型标记
    unit: Unit tests (单元测试)
    integration: Integration tests (集成测试)
    e2e: End-to-end user scenario (端到端用户场景测试)
    smoke: Quick smoke tests for CI (冒烟测试)
    regression: Regression tests (回归测试)
    flaky: Flaky tests that may intermittently fail (不稳定测试)
    
    # 功能域标记
    entropy: Entropy pool health check tests (熵池健康检查测试)
    deprecation: Deprecation warning tests (弃用警告测试)
    gpu: GPU-related tests (GPU相关测试)
    gpu_kernel: GPU kernel correctness tests (GPU内核正确性测试)
    gpu_hardware: Tests requiring real GPU (真实GPU硬件测试)
    multi_gpu: Multi-GPU topology tests (多GPU拓扑测试)
    multi_format: Multi-format address tests (多格式地址测试)
    thread_safety: Thread safety tests (线程安全测试)
    progress: Progress callback tests (进度回调测试)
    security: Security tests (安全测试)
    cross_platform: Cross-platform tests (跨平台测试)
    edge_cases: Edge case tests (边界条件测试)
    state_machine: State machine transition tests (状态机转移测试)
    combinatorial: Combinatorial parameter tests (组合参数测试)
    performance: Performance benchmark tests (性能基准测试)
    
    # 环境条件标记
    skipunless: Conditional skip marker（条件跳过，仅当条件满足时运行）
    
    # 验收测试标记
    acceptance: Acceptance tests (验收测试 - 端到端功能验证)
    pipeline: Pipeline integration tests (Pipeline 集成测试 - 多步骤数据流转)
    white_box: White-box tests (白盒测试 - 基于内部代码结构)
    black_box: Black-box tests (黑盒测试 - 基于规格说明)
    lifecycle: Lifecycle tests (生命周期测试 - 组件完整生命周期)
    aux_function: Auxiliary function tests (辅助功能测试 - 辅助函数和工具)
    aux_data: Auxiliary data tests (辅助数据测试 - 数据辅助工具和转换)
    functional: Functional layer tests (功能层测试 - 功能正确性、调用、判断)
    data_layer: Data layer tests (数据层测试 - 数据、数据流、数据管道)
    logic_layer: Logic layer tests (逻辑层测试 - 代码正确性、逻辑、判断)

    # 优先级标记
    p1_high: P1 high priority fixes (P1高优先级修复)
    p2_medium: P2 medium priority fixes (P2中优先级修复)
    p3_low: P3 low priority fixes (P3低优先级修复)

# 测试发现配置
testpaths =
    tests
norecursedirs =
    archive
    .git
    .eggs
    __pycache__
    .hypothesis
    .pytest_cache
    node_modules
    venv
    .venv
    dist
    build
    *.egg
    *.egg-info

# Python文件模式
python_files =
    test_*.py
    *_test.py

# Python类模式
python_classes =
    Test*
    *Test

# Python函数模式
python_functions =
    test_*

# 详细输出模式
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --log-cli-level=WARNING

# 过滤警告信息(可选)
filterwarnings =
