# pytest配置文件
# 用于注册自定义标记和配置测试行为

[pytest]
# 注册自定义标记,消除PytestUnknownMarkWarning警告
markers =
    # 测试类型标记
    unit: Unit tests (单元测试)
    integration: Integration tests (集成测试)
    e2e: End-to-end user scenario (端到端用户场景测试)
    smoke: Quick smoke tests for CI (冒烟测试)
    
    # 功能域标记
    entropy: Entropy pool health check tests (熵池健康检查测试)
    deprecation: Deprecation warning tests (弃用警告测试)
    gpu: GPU-related tests (GPU相关测试)
    gpu_hardware: Tests requiring real GPU (真实GPU硬件测试)
    multi_gpu: Multi-GPU topology tests (多GPU拓扑测试)
    multi_format: Multi-format address tests (多格式地址测试)
    thread_safety: Thread safety tests (线程安全测试)
    progress: Progress callback tests (进度回调测试)
    security: Security tests (安全测试)
    cross_platform: Cross-platform tests (跨平台测试)
    edge_cases: Edge case tests (边界条件测试)
    state_machine: State machine transition tests (状态机转移测试)
    combinatorial: Combinatorial parameter tests (组合参数测试)
    performance: Performance benchmark tests (性能基准测试)
    
    # 优先级标记
    p1_high: P1 high priority fixes (P1高优先级修复)
    p2_medium: P2 medium priority fixes (P2中优先级修复)
    p3_low: P3 low priority fixes (P3低优先级修复)

# 测试发现配置
testpaths =
    tests

# Python文件模式
python_files =
    test_*.py
    *_test.py

# Python类模式
python_classes =
    Test*
    *Test

# Python函数模式
python_functions =
    test_*

# 详细输出模式
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config

# 日志配置
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 过滤警告信息(可选)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
