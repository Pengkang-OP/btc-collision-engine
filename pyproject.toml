[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-collision-engine"
version = "3.1.1"
description = "比特币私钥碰撞引擎，支持CPU和GPU加速，用于学习和研究比特币地址碰撞"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "BTC Project"}
]
keywords = ["bitcoin", "collision", "gpu", "opencl", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]

# 核心必须依赖
dependencies = [
    "coincurve>=13.0.0",
    "gmpy2>=2.1.0,<3.0.0",
    "pycryptodome>=3.19.0,<4.0.0",
    "cachetools>=5.3.0",
    "pybloom-live>=2.2.0",
    "bech32>=1.2.0",
    "bitarray>=2.6.0",
    "chardet>=5.0.0,<6.0.0",
    "requests>=2.28.0,<3.0.0",
    "ecdsa>=0.18.0",
    "setproctitle>=1.3.0",
    "psutil>=5.9.0",
    "jsonschema>=4.0.0",  # H-NEW1修复: 配置验证必需依赖
]

[project.optional-dependencies]
# GPU 加速支持
gpu = [
    "pyopencl>=2022.1",
    "numpy>=1.21.0",
]
# 开发与测试工具
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0",
    "memory-profiler>=0.61",
    "bandit>=1.7.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
# 一次性安装所有可选依赖
all = [
    "btc-collision-engine[gpu,dev]",
]

[project.scripts]
btc-collision = "src.cli.main:main"

[project.urls]
Homepage = "https://github.com/your-repo/btc-collision-engine"
"Bug Tracker" = "https://github.com/your-repo/btc-collision-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests", "docs", "benchmarks"]
skips = ["B101"]
