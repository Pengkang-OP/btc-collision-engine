[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-collision-engine"
version = "5.1.0"
description = "比特币私钥碰撞引擎，支持CPU和GPU加速，多格式地址支持，用于学习和研究比特币地址碰撞"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BTC Project" }]
keywords = ["bitcoin", "collision", "gpu", "opencl", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]

# 核心必须依赖
dependencies = [
    "coincurve>=18.0.0,<22.0.0",    # L1: 添加上限防止破坏性升级
    "gmpy2>=2.1.0,<5.0.0",          # v4.5.1: 放宽上限至 4.x
    "pycryptodome>=3.19.0,<5.0.0",  # C-08: 放宽上限
    "cachetools>=5.3.0,<9.0.0",     # v5.0.1: 放宽至 8.x（评估完成：仅用 LRUCache/TTLCache，未用 MRUCache）
    "pybloom-live>=2.2.0,<5.0.0",   # L1: 添加上限
    "bech32>=1.2.0,<2.0.0",         # L1: 添加上限
    "bitarray>=2.6.0,<4.0.0",       # L1: 添加上限
    "chardet>=5.0.0,<6.0.0",
    "requests>=2.28.0,<3.0.0",      # C-12: 接近 3.0，注意破坏性变更
    "ecdsa>=0.18.0,<1.0.0",         # L1: 添加上限
    "setproctitle>=1.3.0,<2.0.0",   # L1: 添加上限
    "psutil>=5.9.0,<8.0.0",         # L1: psutil API 稳定，放宽至 6.x
    "jsonschema>=4.0.0,<5.0.0",     # H-NEW1: 配置验证必需依赖
    "cryptography>=43.0.0,<46.0.0", # C-03: 放宽上限至 45.x
    "PyNaCl>=1.5.0,<2.0.0",
    "rich>=13.0,<16.0.0",           # L1: 添加上限
    "cffi>=1.15.0,<3.0.0",          # L1: 添加上限
    "numpy>=1.24.0,<3.0.0",         # v5.0.1: 放宽至 2.x（评估完成：未使用移除别名/方法，低风险）
]

[project.optional-dependencies]
# GPU 加速支持
gpu = [
    "pyopencl>=2022.1,<2027.0",     # v5.0.1: 放宽至 2026.x（评估完成：无 API 破坏性变更，低风险）
    "numpy>=1.24.0,<3.0.0",         # v5.0.1: 放宽至 2.x（与主依赖一致）
    "gmpy2>=2.1.0,<5.0.0",          # v4.5.1: 与主依赖一致
    "pycryptodome>=3.19.0,<5.0.0",  # C-08: 与主依赖一致
    "nvidia-ml-py>=12.0.0,<14.0.0", # L1: 添加上限
]
# 开发与测试工具
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<8.0.0",          # L1: 添加上限
    "pytest-benchmark>=4.0,<6.0.0",      # L1: 添加上限
    "pytest-rerunfailures>=3.0,<17.0.0", # L1: 添加上限
    "pytest-timeout>=2.0,<3.0.0",        # L1: 添加上限
    "memory-profiler>=0.61,<1.0.0",      # L1: 添加上限
    "bandit>=1.7.0,<2.0.0",              # L1: 添加上限
    "ruff>=0.9.0,<2.0.0",                # 统一：与 requirements-dev.txt 一致
    "mypy>=1.0.0,<3.0.0",                # L1: 放宽上限以支持 mypy 2.x（pre-commit 已使用 mypy 2.1.0）
    # P0-4: black/flake8 已废弃，由 ruff (format+lint) 替代
    "sphinx>=7.0.0,<9.0.0",              # L1: 添加上限
    "sphinx-rtd-theme>=1.3.0,<4.0.0",    # L1: 添加上限
    "hypothesis>=6.0.0,<7.0.0",          # 模糊测试（与 requirements-dev.txt 一致）
    "types-cachetools>=5.0,<9.0.0",      # cachetools 类型存根（v5.0.1: 与 cachetools 上限同步放宽）
]
# 一次性安装所有可选依赖
all = ["btc-collision-engine[gpu,dev]"]

# Windows 平台可选依赖（断点文件 ACL 设置）
# checkpoint_manager.py 使用 pywin32 设置 Windows DACL
# 若 pywin32 不可用，自动降级为 icacls 命令（系统内置）
windows = ["pywin32>=306"]

[project.scripts]
btc-collision = "src.cli.main:main"

[project.urls]
Homepage = "https://github.com/btc-project/btc-collision-engine"
"Bug Tracker" = "https://github.com/btc-project/btc-collision-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# pytest 配置已迁移至 pytest.ini，此处不再重复定义以避免冲突

[tool.mypy]
# P2-23: strict 模式已完全启用（2026-05-29）
strict = true
python_version = "3.12" # 与 CI type-check job 使用的 Python 版本一致
ignore_missing_imports = true
warn_unused_configs = true
# 以下为 strict=true 的显式覆写（因项目特殊情况保留）
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
disallow_incomplete_defs = true
exclude = [
    "tests/",
    "benchmarks/",
    "scripts/",
    "src/gpu/pyopencl_stubs/",
]
mypy_path = ["src/gpu/pyopencl_stubs"] # pyopencl stub 文件路径



[tool.ruff]
line-length = 105 # 略高于标准100以容纳中文日志/长变量名
target-version = "py312"
fix = true
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "venv",
    "scripts/venv",
    ".history",
    "data_logs",
    "logs",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    "Dockerfile*",   # 非 Python 文件（目录扫描时跳过，避免 ruff 误解析）
    "pytest.ini",     # INI 配置，非 Python 文件（同上）
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "SIM", "B", "T20", "D"]
ignore = ["E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"
# ROADMAP #15: Docstring (D) rules enabled with Google convention.
# Phase 1: Fixed 7841 D415 + 5 D301 violations via `ruff --fix --unsafe-fixes`.
# Phase 2: Replaced blanket "**/*.py" = ["D"] with directory-level exemptions.
# Next: Fix src/ files and remove their exemptions one by one.

[tool.ruff.lint.per-file-ignores]
# ROADMAP #15: Docstring (D) rules — incremental tightening.
# Phase 1: Fixed 7841 D415 + 5 D301 violations across all Python files.
# Phase 2: Replaced blanket "**/*.py" = ["D"] with directory-level exemptions.
# Phase 3: src/ — 41 files cleaned (34 D205 auto-fixed via _fix_d205_v4.py),
#          16 exemptions removed. 16 files remain with D exemptions.
# Next: Fix remaining files and remove exemptions one by one.
# ALL src/ D exemptions have been resolved. See Phase 3 summary.
"scripts/**/*.py" = [
    "E501",
    "E402",
    "T201",
    "D",
] # 脚本：sys.path.insert + 可读性长行 + print合法。D (pydocstyle) 暂不强制
"benchmarks/**/*.py" = ["T201", "D"] # 基准测试：允许 print + D 暂不强制（E501/E402 已零违规移除）
"tests/**/*.py" = [
    "T201",   # 测试代码：print 调试输出合法
    "N806",   # Mock/数学变量名大写合法（MockDeviceManager, G, bpMB 等）
    "N802",   # 测试函数名含数学符号大写（G, K, O, I, P, N 等）
    "N801",   # 测试类名格式豁免
    "SIM117", # 嵌套 with 语句在 mock 场景中合法
    "SIM105", # suppressible-exception 在测试中合法
    "B017",   # assert-raises-exception 盲捕获在测试中合法
    "B007",   # 未使用循环变量在 fixture 中合法
    "B023",   # 函数内引用循环变量在 fixture 中合法
    "SIM115", # 测试中直接 open() 合法（fixture/benchmark 场景）
    "E402",   # sys.path.insert 需在 import 之前
    "E501",   # 测试数据/长字符串可读性优先
    "B904",   # raise-without-from 在测试中可接受
    "N818",   # 测试异常命名豁免
    "E741",   # 数学变量名 l 在测试中可接受
    "N814",   # 测试中导入缩写合法（TR1, TR2 等）
    "N817",   # 测试中导入缩写合合法（CM 等）
    "D",      # D (pydocstyle) 暂不强制 — 测试函数常见无 docstring
] # 测试代码：广泛豁免常见测试模式
# ── 合法 CLI 工具允许 print() 输出 ──────────────────────────
"src/cli/*.py" = ["T201"] # CLI 命令行接口输出
"src/utils/first_run_wizard.py" = ["T201"] # 首次运行向导
"src/wizard/*.py" = ["T201"] # 向导引擎
"src/automation/*.py" = ["T201"] # 自动化闭环 CLI
"src/utils/performance_benchmark.py" = ["T201"] # 性能基准测试 CLI
"src/utils/health_check.py" = ["T201"] # 健康检查 CLI
"src/gpu/multi_format_multi_gpu_engine.py" = ["T201"] # GPU 引擎示例/测试
"tools/**/*.py" = [
    "T201", # 运维工具：print 合法输出
    "E402", # sys.path.insert 需在 import 之前
    "E501", # 工具脚本：长行可读性优先
    "B007", # 未使用循环变量可接受
    "E741", # 工具脚本中 l 变量可接受
    "D",    # D (pydocstyle) 暂不强制
] # 运维工具：豁免常见模式
# ── 示例代码允许 print() ──────────────────────────
"examples/**/*.py" = [
    "T201", # demo/示例代码：print 输出合法
    "W293", # 空白行尾空格可接受
    "E501", # demo 代码：长行可读性优先
    "E402", # sys.path 操作需在 import 之前
]
# ── 根目录入口脚本允许 print() ──────────────────────────
"start.py" = ["T201"]
"start_menu.py" = ["E402"] # 薄引导：sys.path 操作需在 import 之前
"src/start_menu/*.py" = ["T201", "C901", "SIM105"] # 启动菜单：print+复杂度+简化写法合法
"key_collision_cli.py" = ["T201"]
"key_collision.py" = [
    "E501",  # CLI 入口：长行可读性优先
]
"conftest.py" = ["SIM115"] # pytest fixture 中直接 open() 合法

# ── 个别文件豁免 ──────────────────────────────────────────
"tests/test_multi_format_conversion.py" = [
    "F821",
] # AddressConverter 模块已移除，变量通过 try/except+locals() 守卫
"tests/conftest.py" = ["C901"] # pytest_sessionfinish 固有复杂度
"tests/test_stability_24h.py" = ["C901"] # 稳定性测试 run() 固有复杂度
"tools/validate_config.py" = ["N806"] # ConfigManager/CM 是类引用，不是变量
"tools/performance_baseline.py" = ["N806"] # G 是数学群元素，非变量
"tools/check_async_status.py" = ["C901"] # 巡检脚本 check_async_status() 固有复杂度
"tools/check_ui_freeze.py" = ["C901"] # GUI 进程检查 check_gui_process() 固有复杂度
"tools/monitor_async_effect.py" = ["C901"] # 异步监控 monitor_async_stats() 固有复杂度
"tools/monitor_dashboard.py" = ["C901"] # 仪表盘 analyze_current_run() 固有复杂度
"tools/status_report.py" = ["C901"] # 报告生成 generate_report() 固有复杂度

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
# GPU 源码纳入覆盖率统计：GPU 测试已通过 marker 机制在有 GPU 硬件的 CI runner
# 上自动运行并获得实际覆盖率数据；无 GPU 环境则跳过 GPU 测试但保留代码统计。

[tool.bandit]
exclude_dirs = ["tests", "docs", "benchmarks"]
# B101: assert 语句在本项目中广泛用于防御性编程(非安全校验), 不构成安全风险
# B105: Bandit 基于变量名模式匹配，误报率极高（配置版本号/延迟值被误标记为密码）
skips = ["B101", "B105"]
