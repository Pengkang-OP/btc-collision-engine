[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-collision-engine"
version = "3.5.1"
description = "比特币私钥碰撞引擎，支持CPU和GPU加速，用于学习和研究比特币地址碰撞"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BTC Project" }]
keywords = ["bitcoin", "collision", "gpu", "opencl", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]

# 核心必须依赖
dependencies = [
    "coincurve>=18.0.0",
    "gmpy2>=2.1.0,<3.0.0",
    "pycryptodome>=3.19.0,<4.0.0",
    "cachetools>=5.3.0",
    "pybloom-live>=2.2.0",
    "bech32>=1.2.0",
    "bitarray>=2.6.0",
    "chardet>=5.0.0,<6.0.0",
    "requests>=2.28.0,<3.0.0",
    "ecdsa>=0.18.0",
    "setproctitle>=1.3.0",
    "psutil>=5.9.0",
    "jsonschema>=4.0.0",            # H-NEW1修复: 配置验证必需依赖
    "cryptography>=43.0.0,<44.0.0",
    "PyNaCl>=1.5.0,<2.0.0",
    "rich>=13.0",                   # CLI 富文本输出
    "cffi>=1.15.0",                 # coincurve/cryptography 的 C FFI 依赖
]

[project.optional-dependencies]
# GPU 加速支持
gpu = [
    "pyopencl>=2022.1",
    "numpy>=1.24.0",
    "gmpy2>=2.1.0,<3.0.0",         # GPU大整数运算加速
    "pycryptodome>=3.19.0,<4.0.0", # GPU SIMD哈希优化
]
# 开发与测试工具
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0",
    "pytest-rerunfailures>=3.0",
    "pytest-timeout>=2.0",
    "memory-profiler>=0.61",
    "bandit>=1.7.0",
    "mypy>=1.0.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
# 一次性安装所有可选依赖
all = ["btc-collision-engine[gpu,dev]"]

[project.scripts]
btc-collision = "src.cli.main:main"

[project.urls]
Homepage = "https://github.com/your-repo/btc-collision-engine"
"Bug Tracker" = "https://github.com/your-repo/btc-collision-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config"
log_cli = true
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    # 测试类型标记
    "unit: Unit tests (单元测试)",
    "integration: Integration tests (集成测试)",
    "smoke: Smoke tests - quick core verification (冒烟测试)",
    "regression: Regression tests for known bugs (回归测试)",
    # 功能域标记
    "entropy: Entropy pool health check tests (熵池健康检查测试)",
    "deprecation: Deprecation warning tests (弃用警告测试)",
    "gpu: GPU-related tests (GPU相关测试)",
    "gpu_kernel: GPU kernel correctness regression tests (GPU内核正确性回归测试)",
    "thread_safety: Thread safety tests (线程安全测试)",
    "progress: Progress callback tests (进度回调测试)",
    "security: Security tests (安全测试)",
    "cross_platform: Cross-platform tests (跨平台测试)",
    "edge_cases: Edge case tests (边界条件测试)",
    # 优先级标记
    "p1_high: P1 high priority fixes (P1高优先级修复)",
    "p2_medium: P2 medium priority fixes (P2中优先级修复)",
    "p3_low: P3 low priority fixes (P3低优先级修复)",
    # 其他标记
    "flaky: Flaky tests that may need reruns (不稳定的测试，允许重试)",
]

[tool.mypy]
python_version = "3.11"                                   # 与 CI type-check job 使用的 Python 版本一致
ignore_missing_imports = true
warn_return_any = false                                   # 大量底层C库返回Any，暂不强制
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false                             # 渐进式类型化，暂不强制函数签名
disallow_incomplete_defs = false                          # 允许部分类型注解
disallow_untyped_calls = false                            # 允许调用未类型化函数
no_implicit_optional = true                               # 防止隐式Optional
strict_equality = true                                    # 防止不安全的类型比较
exclude = ["tests/", "benchmarks/", "tools/", "scripts/"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests", "docs", "benchmarks"]
skips = ["B101"]
