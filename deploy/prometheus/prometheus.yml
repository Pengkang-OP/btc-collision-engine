# Prometheus配置 - BTC碰撞引擎监控
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（需要创建 rules/ 目录后启用）
# rule_files:
#   - "rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # BTC碰撞引擎指标（需引擎暴露 /metrics 端点后启用）
  # 当前引擎未内置 Prometheus exporter，请先启动 metrics-exporter 再取消注释
  # - job_name: 'btc-collision-engine'
  #   scrape_interval: 10s
  #   static_configs:
  #     - targets: ['btc-engine-exporter:9100']
  #       labels:
  #         instance: 'btc-collision-cpu'
  #         mode: 'cpu'

  # GPU模式指标（需要引擎暴露 /metrics 端点后启用）
  # - job_name: 'btc-collision-gpu'
  #   scrape_interval: 10s
  #   static_configs:
  #     - targets: ['btc-engine-gpu-exporter:9100']
  #       labels:
  #         instance: 'btc-collision-gpu'
  #         mode: 'gpu'

  # 节点导出器（系统指标，需独立部署 node_exporter）
